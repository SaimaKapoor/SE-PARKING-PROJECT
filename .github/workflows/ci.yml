name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Repository & Code Health Check
  # ==========================================
  health-check:
    name: Code & Structure Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "=========================================="
          echo "🔍 SE Parking Project - CI Pipeline"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "=========================================="
          echo "Files in root:"
          ls -la

  # ==========================================
  # JOB 2: Backend Build, Lint, and Test
  # ==========================================
  backend-ci:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: |
            server/package-lock.json
            backend/package-lock.json
            package-lock.json

      - name: Run Backend CI
        run: |
          TARGET_DIR=""
          if [ -d "server" ] && [ -f "server/package.json" ]; then
            TARGET_DIR="server"
          elif [ -d "backend" ] && [ -f "backend/package.json" ]; then
            TARGET_DIR="backend"
          elif [ -f "package.json" ]; then
            TARGET_DIR="."
          fi

          if [ -n "$TARGET_DIR" ]; then
            echo "📦 Running backend CI in directory: $TARGET_DIR"
            cd "$TARGET_DIR"
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi

            # Run lint if configured
            if npm run | grep -q "lint"; then
              echo "🧹 Running linter..."
              npm run lint
            fi

            # Run unit tests
            echo "🧪 Running tests (Jest)..."
            npm test --if-present
          else
            echo "ℹ️ No backend package.json detected yet. Preparing pipeline for upcoming server code."
          fi

  # ==========================================
  # JOB 3: Frontend Build and Lint
  # ==========================================
  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache-dependency-path: |
            client/package-lock.json
            frontend/package-lock.json

      - name: Run Frontend CI
        run: |
          TARGET_DIR=""
          if [ -d "client" ] && [ -f "client/package.json" ]; then
            TARGET_DIR="client"
          elif [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            TARGET_DIR="frontend"
          fi

          if [ -n "$TARGET_DIR" ]; then
            echo "⚛️ Running frontend CI in directory: $TARGET_DIR"
            cd "$TARGET_DIR"
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi

            # Run lint if configured
            if npm run | grep -q "lint"; then
              echo "🧹 Running frontend linter..."
              npm run lint
            fi

            # Run build
            if npm run | grep -q "build"; then
              echo "🏗️ Running frontend build (Vite)..."
              npm run build
            fi
          else
            echo "ℹ️ No frontend package.json detected yet. Preparing pipeline for upcoming client code."
          fi

  # ==========================================
  # JOB 4: Status Summary
  # ==========================================
  ci-status:
    name: CI Pipeline Status
    needs: [health-check, backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check overall result
        run: |
          if [ "${{ needs.health-check.result }}" == "success" ] && \
             [ "${{ needs.backend-ci.result }}" == "success" ] && \
             [ "${{ needs.frontend-ci.result }}" == "success" ]; then
            echo "✅ All CI checks passed successfully!"
            exit 0
          else
            echo "❌ Some CI checks failed. Please inspect the job logs above."
            exit 1
          fi
